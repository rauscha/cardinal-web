<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>Cardinal Web spike B+: live glyphs on the real engine</title>
<style>
  :root { --bg:#111; --card:#1c1c1f; --card2:#242428; --line:#3a3a40; --text:#ececec; --muted:#9a9aa3;
          --audio:#ffb648; --cv:#5fb3ff; --gate:#f2f2f2; --clock:#b9b9b9; --accent:#e9e9e9; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overscroll-behavior:none; }
  header { position:sticky; top:0; z-index:5; background:rgba(17,17,17,.94); backdrop-filter:blur(6px); padding:10px 12px 8px; border-bottom:1px solid var(--line); }
  header h1 { margin:0 0 6px; font-size:15px; font-weight:600; } header h1 span { color:var(--muted); font-weight:400; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn { border:1px solid var(--line); background:#2a2a30; color:var(--text); font:inherit; font-weight:600; padding:9px 12px; border-radius:9px; }
  .btn.primary { background:var(--accent); color:#111; border-color:var(--accent); }
  .btn:disabled { opacity:.4; }
  .card.flash { box-shadow:0 0 0 3px var(--accent); }
  #patchname { margin-top:8px; font-size:13.5px; } #patchname span { color:var(--muted); font-size:12.5px; }
  .plist { padding:6px 0 calc(16px + env(safe-area-inset-bottom)); overflow-y:auto; flex:1; }
  .prow { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid #26262b; }
  .prow .pn { flex:1; min-width:0; } .prow .pn b { display:block; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .prow .pn span { color:var(--muted); font-size:12px; }
  .prow button { border:1px solid var(--line); background:#2a2a30; color:var(--text); font:inherit; font-size:13px; font-weight:600; padding:7px 10px; border-radius:8px; }
  .prow button.danger { background:#5a2a2a; }
  .sheet-actions { display:flex; gap:8px; flex-wrap:wrap; padding:10px 12px; border-bottom:1px solid var(--line); }
  #stats { font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:6px; line-height:1.5; }
  #stats b { color:var(--text); font-weight:600; }
  main { position:relative; padding:4px 12px 40px 44px; max-width:560px; }
  #wires { position:absolute; left:0; top:0; width:44px; height:100%; pointer-events:none; overflow:visible; }
  #wires .wire-hit { pointer-events:stroke; cursor:pointer; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; margin:12px 0; overflow:hidden; }
  .card .hd { display:flex; align-items:baseline; gap:10px; padding:12px 14px 6px; }
  .card .hd h2 { margin:0; font-size:17px; font-weight:700; }
  .card .hd .what { color:var(--muted); font-size:13px; flex:1; }
  .pic { display:block; width:100%; height:110px; background:#141417; }
  .ctl { padding:6px 14px; }
  .bar { display:grid; grid-template-columns:86px 1fr 74px; align-items:center; gap:10px; padding:6px 0; }
  .bar label { color:var(--muted); font-size:12.5px; text-transform:uppercase; letter-spacing:.4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar .track { position:relative; height:34px; background:#2b2b31; border-radius:8px; touch-action:none; }
  .bar .fill { position:absolute; left:0; top:0; bottom:0; width:0; background:#4a4a55; border-radius:8px; }
  .bar .knob { position:absolute; top:4px; bottom:4px; width:6px; margin-left:-3px; background:var(--accent); border-radius:3px; }
  .bar .val { text-align:right; font-variant-numeric:tabular-nums; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .more { color:var(--muted); font-size:13px; padding:2px 14px 10px; }
  .more summary { cursor:pointer; }
  .ports { display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; padding:8px 14px 12px; border-top:1px solid var(--line); background:var(--card2); }
  .ports h3 { margin:0 0 4px; font-size:11px; letter-spacing:.6px; color:var(--muted); font-weight:600; }
  .jack { display:flex; align-items:center; gap:8px; padding:5px 0; font-size:13.5px; }
  .jack.out { justify-content:flex-end; text-align:right; }
  .jack svg { width:22px; height:22px; flex:none; opacity:.45; transition:opacity .08s linear; }
  .jack.live svg { opacity:1; }
  .jack .v { color:var(--muted); font-size:11px; min-width:38px; font-variant-numeric:tabular-nums; }
  .jack.out .v { text-align:left; }
  .jack { touch-action:none; border-radius:8px; padding-left:4px; padding-right:4px; margin:0 -4px; position:relative; }
  .jack.target { background:rgba(255,255,255,.05); }
  .jack.target.match { background:rgba(255,255,255,.10); }
  .jack.target.match svg { opacity:.9; }
  .jack.hover { background:#4a4a55; }
  .jack.armed { background:#3a3a42; box-shadow:0 0 0 2px var(--accent) inset; }
  .jack.connected::after { content:''; position:absolute; top:4px; right:4px; width:6px; height:6px; border-radius:50%; background:var(--muted); }
  .jack.out.connected::after { right:auto; left:4px; }
  #sheet { position:fixed; left:0; right:0; bottom:0; top:18vh; z-index:40; background:#1a1a1e; border-top:1px solid var(--line); border-radius:16px 16px 0 0; display:flex; flex-direction:column; box-shadow:0 -10px 40px rgba(0,0,0,.6); }
  #sheet[hidden] { display:none; }
  #psheet { position:fixed; left:0; right:0; bottom:0; top:18vh; z-index:40; background:#1a1a1e; border-top:1px solid var(--line); border-radius:16px 16px 0 0; display:flex; flex-direction:column; box-shadow:0 -10px 40px rgba(0,0,0,.6); }
  #psheet[hidden] { display:none; }
  .sheet-hd { display:flex; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
  .sheet-hd input { flex:1; font:inherit; font-size:16px; padding:9px 12px; border-radius:9px; border:1px solid var(--line); background:#2b2b31; color:var(--text); }
  .tags { display:flex; gap:6px; overflow-x:auto; padding:8px 12px; border-bottom:1px solid var(--line); }
  .tags button { flex:none; border:1px solid var(--line); background:#2a2a30; color:var(--muted); font:inherit; font-size:13px; padding:6px 10px; border-radius:999px; }
  .tags button[aria-pressed="true"] { background:#3a3a42; color:var(--text); }
  #sheet-list { overflow-y:auto; flex:1; padding:6px 0 calc(16px + env(safe-area-inset-bottom)); }
  .model { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid #26262b; background:transparent; color:var(--text); font:inherit; padding:12px 14px; }
  .model b { display:block; font-size:15px; } .model span { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; } .model i { font-style:normal; color:var(--muted); font-size:11.5px; }
  .card .hd .menu { border:1px solid var(--line); background:#2a2a30; color:var(--text); border-radius:50%; width:30px; height:30px; font-weight:700; flex:none; }
  #ghost { position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:30; }
  #chip { position:fixed; left:12px; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:31; background:#2a2a30; border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:none; flex-wrap:wrap; align-items:center; gap:8px 10px; font-size:14px; box-shadow:0 6px 24px rgba(0,0,0,.5); }
  #chip .t { flex:1 1 180px; }
  #chip button { flex:0 0 auto; white-space:nowrap; }
  #chip.show { display:flex; }
  main.chip-open { padding-bottom:170px; }
  #chip .t { flex:1; } #chip .t b { font-weight:600; }
  #chip button { border:1px solid var(--line); background:#3a3a42; color:var(--text); font:inherit; font-weight:600; padding:8px 12px; border-radius:9px; }
  #chip button.danger { background:#5a2a2a; }
  .steps { display:grid; grid-template-columns:repeat(8,1fr); gap:5px; padding:8px 14px 2px; }
  .steps div { height:64px; border-radius:7px; background:#2b2b31; position:relative; overflow:hidden; }
  .steps div i { position:absolute; left:0; right:0; bottom:0; background:#5a5a68; }
  .steps div.cur { outline:2px solid var(--accent); }
  .steps div b { position:absolute; left:0; right:0; bottom:4px; text-align:center; font-size:11px; color:var(--text); font-weight:600; }
  .run { border:0; border-radius:10px; padding:12px 16px; font:inherit; font-weight:700; background:#3a3a42; color:var(--text); }
  .run[aria-pressed="true"] { background:var(--accent); color:#111; }
  #canvas_wrapper { --device-pixel-ratio:1; position:fixed; left:-10000px; top:0; width:900px; height:450px; transform-origin:0 0 0; transform:scale(calc(1 / var(--device-pixel-ratio))); }
  #canvas_wrapper.shown { left:0; top:auto; bottom:0; width:100vw; height:60vh; z-index:20; background:#000; }
  #canvas_file_open { display:none; }
  #boot { padding:16px 12px; color:var(--muted); }
  @media (orientation: landscape) and (min-width: 700px) {
    main { max-width:none; display:flex; gap:12px; overflow-x:auto; padding-left:12px; }
    .card { flex:0 0 340px; } #wires { width:100%; left:0; }
  }
</style>
</head>
<body>
<header>
  <h1>Spike B+ <span>· glyph cards driven by the real Cardinal engine · C++ canvas hidden</span></h1>
  <div class="row">
    <button class="btn primary" id="start">Tap to start audio</button>
    <button class="btn" id="toggle-ui">Show stock UI</button>
    <button class="btn" id="latency">Latency test</button>
    <button class="btn" id="reload">Reload startup patch</button>
    <button class="btn" id="add">Add module</button>
    <button class="btn" id="save">Save</button>
    <button class="btn" id="patches">Patches</button>
    <button class="btn" id="undo" disabled>Undo</button>
    <button class="btn" id="redo" disabled>Redo</button>
  </div>
  <div id="patchname"><b id="pname">Untitled</b> <span id="psaved"></span></div>
  <div id="stats">loading engine…</div>
</header>
<div id="boot">Loading the engine (about 10 MB). The page builds its cards from the engine's own module list.</div>
<main id="main"><svg id="wires"></svg></main>
<div id="sheet" hidden>
  <div class="sheet-hd"><input id="sheet-q" type="search" placeholder="Search modules" autocomplete="off"><button class="btn" id="sheet-close">Close</button></div>
  <div id="sheet-tags" class="tags"></div>
  <div id="sheet-list"></div>
</div>
<div id="psheet" hidden>
  <div class="sheet-hd"><input id="psheet-name" type="text" placeholder="Patch name" autocomplete="off"><button class="btn primary" id="psheet-save">Save as</button><button class="btn" id="psheet-close">Close</button></div>
  <div class="sheet-actions"><button class="btn" id="p-download">Download .vcv</button><button class="btn" id="p-share">Share</button><button class="btn" id="p-import">Import file</button><button class="btn" id="p-new">New patch</button><input type="file" id="p-file" accept=".vcv,.json,application/json,text/plain" hidden></div>
  <div class="plist" id="plist"></div>
</div>
<svg id="ghost"></svg>
<div id="chip"><div class="t"></div><button id="chip-disconnect" class="danger">Disconnect</button><button id="chip-cancel">Cancel</button></div>
<div id="canvas_wrapper">
  <input type="file" id="canvas_file_open">
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
</div>
<script>
'use strict';
// ---------- Emscripten module setup (same contract as the stock shell, canvas kept offscreen)
var canvasWrapper = document.getElementById('canvas_wrapper');
var simdSupported = WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]));
var Module = {
  preRun: [], postRun: function () { canvasWrapper.style.display = 'block'; window.dispatchEvent(new Event('resize')); setTimeout(bootBridge, 300); },
  locateFile: function (p) { return '../' + (simdSupported ? p : p.replace('CardinalMini', 'CardinalMini-nosimd')); },
  canvas: document.getElementById('canvas'),
  setStatus: function (t) { var b = document.getElementById('boot'); if (b && t) b.textContent = t; },
  totalDependencies: 0, monitorRunDependencies: function () {},
  print: function (t) { console.log(t); }, printErr: function (t) { console.warn(t); }
};
window.addEventListener('load', function () { var s = document.createElement('script'); s.src = '../CardinalMini.js'; s.async = true; document.body.appendChild(s); });

// ---------- bridge
var B = null, uiHidden = false, mods = [], cables = [], watch = [], watchPtr = 0, watchIndex = {}, stats = { frames: [], last: 0 }, latencyTest = null;
function bootBridge() {
  if (typeof Module._cardinalweb_ready !== 'function') { document.getElementById('boot').textContent = 'This engine build has no cardinal-web bridge.'; return; }
  if (!Module._cardinalweb_ready()) { setTimeout(bootBridge, 200); return; }
  B = {
    loadPatch: Module.cwrap('cardinalweb_load_patch', 'number', ['string']),
    modulesJson: Module.cwrap('cardinalweb_get_modules_json', 'string', []),
    cablesJson: Module.cwrap('cardinalweb_get_cables_json', 'string', []),
    setParam: Module.cwrap('cardinalweb_set_param', null, ['number', 'number', 'number']),
    getParam: Module.cwrap('cardinalweb_get_param', 'number', ['number', 'number']),
    paramDisplay: Module.cwrap('cardinalweb_get_param_display', 'string', ['number', 'number']),
    watch: Module.cwrap('cardinalweb_watch', 'number', ['string']),
    readWatched: Module.cwrap('cardinalweb_read_watched', 'number', ['number', 'number']),
    setHidden: Module.cwrap('cardinalweb_set_ui_hidden', null, ['number']),
    setCpuMeter: Module.cwrap('cardinalweb_set_cpu_meter', null, ['number']),
    meterAvg: Module.cwrap('cardinalweb_meter_average', 'number', []),
    meterMax: Module.cwrap('cardinalweb_meter_max', 'number', []),
    addCable: Module.cwrap('cardinalweb_add_cable', 'number', ['number', 'number', 'number', 'number']),
    removeCable: Module.cwrap('cardinalweb_remove_cable', 'number', ['number']),
    moveCable: Module.cwrap('cardinalweb_move_cable', 'number', ['number', 'number', 'number', 'number', 'number']),
    modelsJson: Module.cwrap('cardinalweb_get_models_json', 'string', []),
    patchJson: Module.cwrap('cardinalweb_get_patch_json', 'string', []),
    addModule: Module.cwrap('cardinalweb_add_module', 'number', ['string', 'string']),
    removeModule: Module.cwrap('cardinalweb_remove_module', 'number', ['number']),
    paramCommit: Module.cwrap('cardinalweb_param_commit', null, ['number', 'number', 'number', 'number']),
    canUndo: Module.cwrap('cardinalweb_can_undo', 'number', []), canRedo: Module.cwrap('cardinalweb_can_redo', 'number', []),
    undoName: Module.cwrap('cardinalweb_undo_name', 'string', []), redoName: Module.cwrap('cardinalweb_redo_name', 'string', []),
    undo: Module.cwrap('cardinalweb_undo', 'number', []), redo: Module.cwrap('cardinalweb_redo', 'number', []),
  };
  B.setCpuMeter(1); B.setHidden(1); uiHidden = true; setTimeout(updateUndo, 0);
  document.getElementById('boot').remove();
  rebuild();
  requestAnimationFrame(frame);
  setTimeout(offerRestore, 800);
}
function rebuild() {
  mods = JSON.parse(B.modulesJson()); cables = JSON.parse(B.cablesJson());
  mods.sort((a, b) => (a.pos ? a.pos[1] * 1000 + a.pos[0] : 0) - (b.pos ? b.pos[1] * 1000 + b.pos[0] : 0));
  var main = document.getElementById('main'); main.innerHTML = '<svg id="wires"></svg>' + mods.map(card).join('');
  // watch list: every input and output voltage, in module order
  watch = []; watchIndex = {};
  mods.forEach(m => { m.inputs.forEach(p => { watchIndex[m.id + ':i' + p.id] = watch.length; watch.push([m.id, 0, p.id]); });
                      m.outputs.forEach(p => { watchIndex[m.id + ':o' + p.id] = watch.length; watch.push([m.id, 1, p.id]); }); });
  if (watchPtr) Module._free && Module._free(watchPtr);
  watchPtr = Module._malloc(4 * Math.max(1, watch.length));
  B.watch(JSON.stringify(watch));
  mods.forEach(m => { if (m.model === 'SEQ3') { var r = document.getElementById('run-' + m.id); if (r) r.onclick = () => { B.setParam(m.id, 1, 1); setTimeout(() => B.setParam(m.id, 1, 0), 60); }; } });
  markConnected();
  requestAnimationFrame(drawWires);
}
function refreshCables() { cables = JSON.parse(B.cablesJson()); markConnected(); drawWires(); }
function markConnected() { document.querySelectorAll('.jack').forEach(j => j.classList.remove('connected'));
  cables.forEach(c => { var a = document.getElementById('j-' + c.outputModuleId + '-o' + c.outputId), b = document.getElementById('j-' + c.inputModuleId + '-i' + c.inputId); if (a) a.classList.add('connected'); if (b) b.classList.add('connected'); }); }
// ---------- patching. Model: you hold a PLUG, not a jack.
//  press an OUT jack            -> new cable from it (outputs can feed many inputs, as in Rack)
//  press a free IN jack         -> new cable into it
//  press a connected IN jack    -> you pick up that cable's plug: drop on another IN to move it, or on an OUT to change its source
//  tap a drawn cable            -> chip: Move OUT end / Move IN end / Disconnect
//  finish by drag (edge auto-scroll) or by lift, scroll, tap. Cards never move.
var arm = null, drag = null, lastPointer = null, autoScrollRaf = 0;
var chip = document.getElementById('chip');
function jackOf(el) { return el && el.closest ? el.closest('.jack[data-k]') : null; }
function jackEl(mid, k, pid) { return document.getElementById('j-' + mid + '-' + k + pid); }
function modName(mid) { var m = mods.find(x => x.id === mid); return m ? m.name : '?'; }
function cableOnInput(mid, pid) { return cables.find(c => c.inputModuleId === mid && c.inputId === pid); }
function cablesOnOutput(mid, pid) { return cables.filter(c => c.outputModuleId === mid && c.outputId === pid); }
function cableLabel(c) { var o = jackEl(c.outputModuleId, 'o', c.outputId), i = jackEl(c.inputModuleId, 'i', c.inputId); return '<b>' + esc(modName(c.outputModuleId)) + ' › ' + esc(o ? o.dataset.n : '?') + '</b> → <b>' + esc(modName(c.inputModuleId)) + ' › ' + esc(i ? i.dataset.n : '?') + '</b>'; }
// arm: { el: the fixed jack the ghost is drawn from, type, targets: 'i'|'o'|'io', cable: cable being moved or null, newFrom: jack element when making a new cable }
function setArm(a, html, canDisconnect) {
  clearArm(); arm = a; a.el.classList.add('armed');
  document.querySelectorAll('.jack[data-k]').forEach(t => { if (t === a.el) return; if (a.targets.indexOf(t.dataset.k) < 0) return; if (a.cable && t.dataset.k === 'i' && +t.dataset.m === a.cable.inputModuleId && +t.dataset.p === a.cable.inputId) return;
    t.classList.add('target'); if (t.dataset.t === a.type) t.classList.add('match'); });
  showChip(html, canDisconnect); drawWires();
}
function clearArm() { if (arm) arm.el.classList.remove('armed'); var had = !!arm; arm = null; document.querySelectorAll('.jack.target, .jack.hover').forEach(t => t.classList.remove('target', 'match', 'hover')); hideChip(); clearGhost(); if (had) drawWires(); }
function showChip(html, canDisconnect, extra) { chip.querySelector('.t').innerHTML = html; document.getElementById('chip-disconnect').style.display = canDisconnect ? '' : 'none'; chip.querySelectorAll('.extra').forEach(b => b.remove());
  (extra || []).forEach(x => { var b = document.createElement('button'); b.className = 'extra'; b.textContent = x[0]; b.onclick = x[1]; chip.insertBefore(b, document.getElementById('chip-disconnect')); }); chip.classList.add('show'); document.getElementById('main').classList.add('chip-open'); }
function hideChip() { chip.classList.remove('show'); document.getElementById('main').classList.remove('chip-open'); }
function pickUpInput(j) { // hold the plug that sits in this connected input
  var c = cableOnInput(+j.dataset.m, +j.dataset.p), o = jackEl(c.outputModuleId, 'o', c.outputId); if (!o) return;
  setArm({ el: o, type: j.dataset.t, targets: 'io', cable: c, held: j }, 'Holding the cable from ' + cableLabel(c) + '<br>drop on another <b>IN</b> to move it, on an <b>OUT</b> to change its source', true);
}
function startNew(j) {
  var n = j.dataset.k === 'o' ? cablesOnOutput(+j.dataset.m, +j.dataset.p).length : 0;
  setArm({ el: j, type: j.dataset.t, targets: j.dataset.k === 'o' ? 'i' : 'o', cable: null }, '<b>' + esc(modName(+j.dataset.m)) + ' › ' + esc(j.dataset.n) + '</b> · drag or tap ' + (j.dataset.k === 'o' ? 'an <b>IN</b>' : 'an <b>OUT</b>') + ' jack to connect' + (n ? ' · ' + n + ' cable' + (n > 1 ? 's' : '') + ' already here, tap one to move it' : ''), false);
}
function pickCable(c) { // tapped a drawn cable
  var o = jackEl(c.outputModuleId, 'o', c.outputId), i = jackEl(c.inputModuleId, 'i', c.inputId); if (!o || !i) return;
  clearArm(); arm = { el: i, type: i.dataset.t, targets: '', cable: c, picking: true }; i.classList.add('armed'); o.classList.add('armed');
  showChip(cableLabel(c), true, [['Move OUT end', () => setArm({ el: i, type: i.dataset.t, targets: 'o', cable: c }, 'Moving the <b>OUT</b> end of ' + cableLabel(c) + ' · drop or tap an <b>OUT</b> jack', true)],
                                  ['Move IN end', () => setArm({ el: o, type: o.dataset.t, targets: 'i', cable: c }, 'Moving the <b>IN</b> end of ' + cableLabel(c) + ' · drop or tap an <b>IN</b> jack', true)]]);
  drawWires();
}
function dropOn(t) { // finish the armed action on target jack t
  var a = arm; if (!a || !t.classList.contains('target')) return;
  if (a.cable) { var c = a.cable; var outM = c.outputModuleId, outP = c.outputId, inM = c.inputModuleId, inP = c.inputId;
    if (t.dataset.k === 'i') { inM = +t.dataset.m; inP = +t.dataset.p; } else { outM = +t.dataset.m; outP = +t.dataset.p; }
    B.moveCable(c.id, outM, outP, inM, inP); }
  else { var out = a.el.dataset.k === 'o' ? a.el : t, inp = a.el.dataset.k === 'o' ? t : a.el; B.addCable(+out.dataset.m, +out.dataset.p, +inp.dataset.m, +inp.dataset.p); }
  clearArm(); refreshCables(); updateUndo(); touched(); t.classList.add('hover'); setTimeout(() => t.classList.remove('hover'), 350);

  rebuild(); updateUndo(); touched(); var card = document.getElementById('card-' + id); if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'start', inline: 'center' }); card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 900); } });
document.addEventListener('click', e => { var b = e.target.closest('button[data-remove]'); if (!b || !B) return; var m = mods.find(x => x.id === +b.dataset.remove); if (!m) return;
  showChip('Remove <b>' + esc(m.name) + '</b> and its cables? Undo brings it back.', false, [['Remove', () => { B.removeModule(m.id); hideChip(); rebuild(); updateUndo(); touched(); }]]); });
// ---------- saving: autosave to IndexedDB on every change, a named library, file export and import
var DB = { open() { return new Promise((res, rej) => { var r = indexedDB.open('cardinalweb', 1); r.onupgradeneeded = () => r.result.createObjectStore('patches', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async put(rec) { var db = await this.open(); return new Promise((res, rej) => { var t = db.transaction('patches', 'readwrite'); t.objectStore('patches').put(rec); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async get(id) { var db = await this.open(); return new Promise((res, rej) => { var r = db.transaction('patches').objectStore('patches').get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async all() { var db = await this.open(); return new Promise((res, rej) => { var r = db.transaction('patches').objectStore('patches').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); },
  async del(id) { var db = await this.open(); return new Promise((res, rej) => { var t = db.transaction('patches', 'readwrite'); t.objectStore('patches').delete(id); t.oncomplete = res; t.onerror = () => rej(t.error); }); } };
var patch = { name: 'Untitled', id: null, savedJson: null }, autosaveTimer = 0;
function patchJson() { return B.patchJson(); }
function setPatchName(n, id) { patch.name = n || 'Untitled'; patch.id = id || null; document.getElementById('pname').textContent = patch.name; }
function markSaved(when) { document.getElementById('psaved').textContent = when ? '· saved ' + new Date(when).toLocaleTimeString() : '· unsaved changes'; }
function touched() { if (!B) return; clearTimeout(autosaveTimer); autosaveTimer = setTimeout(autosave, 800); if (patch.id) markSaved(null); }
async function autosave() { try { await DB.put({ id: 'autosave', name: patch.name, ofId: patch.id, json: patchJson(), when: Date.now() }); } catch (e) { console.warn('autosave failed', e); } }
async function saveAs(name) { name = (name || '').trim() || patch.name || 'Untitled'; var id = patch.id && patch.name === name ? patch.id : 'p-' + Date.now().toString(36);
  try { await DB.put({ id, name, json: patchJson(), when: Date.now() }); setPatchName(name, id); markSaved(Date.now()); await autosave(); renderPatches(); } catch (e) { alert('Could not save: ' + e); } }
async function loadRecord(rec) { if (!B.loadPatch(rec.json)) { alert('Could not load that patch.'); return; } setPatchName(rec.name, rec.id && rec.id !== 'autosave' ? rec.id : rec.ofId || null); markSaved(rec.when); setTimeout(() => { rebuild(); updateUndo(); }, 200); }
async function renderPatches() { var list = (await DB.all()).filter(r => r.id !== 'autosave').sort((a, b) => b.when - a.when);
  document.getElementById('plist').innerHTML = list.map(r => '<div class="prow" data-id="' + r.id + '"><div class="pn"><b>' + esc(r.name) + '</b><span>' + new Date(r.when).toLocaleString() + ' · ' + Math.round(r.json.length / 1024) + ' KB</span></div><button data-act="load">Load</button><button data-act="download">File</button><button data-act="delete" class="danger">Delete</button></div>').join('') || '<div class="prow"><div class="pn"><span>No saved patches yet. Type a name and tap Save as.</span></div></div>'; }
function downloadJson(name, json) { var blob = new Blob([json], { type: 'application/json' }); var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (name || 'patch').replace(/[^\w.-]+/g, '_') + '.vcv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
async function sharePatch() { var json = patchJson(), file = new File([json], (patch.name || 'patch').replace(/[^\w.-]+/g, '_') + '.vcv', { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: patch.name }); return; } catch (e) { if (e.name === 'AbortError') return; } } downloadJson(patch.name, json); }
document.getElementById('save').onclick = () => { if (!B) return; if (patch.id) saveAs(patch.name); else { openPatches(); document.getElementById('psheet-name').focus(); } };
function openPatches() { document.getElementById('psheet').hidden = false; document.getElementById('psheet-name').value = patch.name === 'Untitled' ? '' : patch.name; renderPatches(); }
document.getElementById('patches').onclick = openPatches;
document.getElementById('psheet-close').onclick = () => document.getElementById('psheet').hidden = true;
document.getElementById('psheet-save').onclick = () => { if (!B) return; saveAs(document.getElementById('psheet-name').value); };
document.getElementById('p-download').onclick = () => { if (B) downloadJson(patch.name, patchJson()); };
document.getElementById('p-share').onclick = () => { if (B) sharePatch(); };
document.getElementById('p-import').onclick = () => document.getElementById('p-file').click();
document.getElementById('p-file').onchange = async e => { var f = e.target.files[0]; if (!f || !B) return; var text = await f.text(); await loadRecord({ name: f.name.replace(/\.(vcv|json)$/i, ''), json: text, when: Date.now() }); document.getElementById('psheet').hidden = true; e.target.value = ''; };
document.getElementById('p-new').onclick = () => { if (!B) return; fetch('../startup.vcv').then(r => r.text()).then(t => { B.loadPatch(t); setPatchName('Untitled', null); markSaved(null); setTimeout(() => { rebuild(); updateUndo(); autosave(); }, 200); document.getElementById('psheet').hidden = true; }); };
document.getElementById('plist').addEventListener('click', async e => { var b = e.target.closest('button[data-act]'); if (!b) return; var id = b.closest('.prow').dataset.id; var rec = await DB.get(id); if (!rec) return;
  if (b.dataset.act === 'load') { await loadRecord(rec); document.getElementById('psheet').hidden = true; }
  else if (b.dataset.act === 'download') downloadJson(rec.name, rec.json);
  else if (b.dataset.act === 'delete') { await DB.del(id); if (patch.id === id) setPatchName(patch.name, null); renderPatches(); } });
async function offerRestore() { try { var a = await DB.get('autosave'); if (!a || !a.json) return; var cur = patchJson(); if (a.json === cur) return;
  showChip('Unsaved work from <b>' + new Date(a.when).toLocaleString() + '</b>' + (a.name && a.name !== 'Untitled' ? ' (' + esc(a.name) + ')' : '') + '. Restore it?', false, [['Restore', async () => { hideChip(); await loadRecord(a); }], ['Keep this', () => { hideChip(); autosave(); }]]); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && B) { clearTimeout(autosaveTimer); autosave(); } });
// ---------- buttons
document.getElementById('start').onclick = function () { var ctx = Module.WebAudioBridge && Module.WebAudioBridge.audioContext; var done = () => { this.textContent = 'Audio running'; this.classList.remove('primary'); }; if (ctx && ctx.state !== 'running') ctx.resume().then(done, done); else done(); };
document.getElementById('toggle-ui').onclick = function () { if (!B) return; uiHidden = !uiHidden; B.setHidden(uiHidden ? 1 : 0); canvasWrapper.classList.toggle('shown', !uiHidden); this.textContent = uiHidden ? 'Show stock UI' : 'Hide stock UI'; window.dispatchEvent(new Event('resize')); };
document.getElementById('latency').onclick = function () { if (!B || latencyTest) return; var vca = mods.find(m => m.model === 'VCA-1'); if (!vca) return; latencyTest = { t0: performance.now(), hits: 0, done: false, restore: B.getParam(vca.id, 0) }; B.setParam(vca.id, 0, 0); setTimeout(() => { if (latencyTest && latencyTest.done) window.lastLatency = latencyTest.ms; }, 900); };
document.getElementById('reload').onclick = function () { if (!B) return; fetch('../startup.vcv').then(r => r.text()).then(t => { B.loadPatch(t); setTimeout(rebuild, 200); }); };
</script>
